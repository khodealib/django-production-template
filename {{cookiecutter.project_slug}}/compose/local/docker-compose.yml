services:
  django:
    build:
      context: ../..
      dockerfile: compose/local/Dockerfile
      target: dev
    env_file:
      - ../../.envs/.env
    ports:
      - "8000:8000"
    volumes:
      - ../../:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "uv run python src/{{ cookiecutter.project_slug }}/manage.py migrate &&
             uv run python src/{{ cookiecutter.project_slug }}/manage.py runserver 0.0.0.0:8000"

  postgres:
    image: postgres:{{ cookiecutter.postgresql_version }}-alpine
    environment:
      POSTGRES_DB: {{ cookiecutter.project_slug }}
      POSTGRES_USER: {{ cookiecutter.project_slug }}
      POSTGRES_PASSWORD: {{ cookiecutter.project_slug }}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ cookiecutter.project_slug }}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:{{ cookiecutter.redis_version }}-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  celeryworker:
    build:
      context: ../..
      dockerfile: compose/local/Dockerfile
      target: dev
    env_file:
      - ../../.envs/.env
    volumes:
      - ../../:/app
    depends_on:
      - postgres
      - redis
    command: >
      sh -c "uv run celery -A config.celery_app worker -l info"

  celerybeat:
    build:
      context: ../..
      dockerfile: compose/local/Dockerfile
      target: dev
    env_file:
      - ../../.envs/.env
    volumes:
      - ../../:/app
    depends_on:
      - postgres
      - redis
    command: >
      sh -c "uv run celery -A config.celery_app beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"

volumes:
  postgres_data:
  redis_data:
