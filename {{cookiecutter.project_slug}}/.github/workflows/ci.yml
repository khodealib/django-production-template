name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "{{ cookiecutter.python_version }}"
      - name: Install dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:{{ cookiecutter.postgresql_version }}-alpine
        env:
          POSTGRES_DB: test_{{ cookiecutter.project_slug }}
          POSTGRES_USER: test_{{ cookiecutter.project_slug }}
          POSTGRES_PASSWORD: test_{{ cookiecutter.project_slug }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_{{ cookiecutter.project_slug }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:{{ cookiecutter.redis_version }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_{{ cookiecutter.project_slug }}
      POSTGRES_USER: test_{{ cookiecutter.project_slug }}
      POSTGRES_PASSWORD: test_{{ cookiecutter.project_slug }}
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "{{ cookiecutter.python_version }}"
      - name: Install dependencies
        run: uv sync
      - name: Run migrations
        run: uv run python src/{{ cookiecutter.project_slug }}/manage.py migrate
      - name: Run tests
        run: uv run pytest --cov --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
